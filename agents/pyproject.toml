[project]
name = "adk-samples"
version = "0.1.0"
description = "Repository of different ADK (Agent Development Kit) agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-adk[extensions]==2.10.0",
    # DatabaseSessionService needs SQLAlchemy; ADK 2.x moved it to an extra.
    "sqlalchemy>=2,<3",
    # The agent builder builds on nuvel: its ADK skills, scaffolder, validator,
    # plugins and guards. Pinned to a commit; nuvel needs google-adk>=2.
    "nuvel-cli @ git+https://github.com/Folken2/nuvel@34d2ebc52a8f5d68b1635709777acbfdc876a09e",
    "opik",
    "exa-py",
    "pydantic>=2.0.0",
    "python-dotenv",
    "asyncpg",
    "greenlet>=3.0.0",
    # Agents use the mcp 1.x API (FastMCP); 2.x renamed it. ADK 2.10 needs >=1.24.
    "mcp>=1.24,<2",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "black",
    "ruff",
    "mypy",
]

[tool.uv]
dev-dependencies = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true

